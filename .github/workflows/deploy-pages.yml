name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot 4.5
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q Godot_v4.5-stable_linux.x86_64.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          unzip -q Godot_v4.5-stable_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/4.5.stable

      - name: Create web export directory
        run: mkdir -p web

      - name: Export for Web
        run: |
          ./Godot_v4.5-stable_linux.x86_64 --headless --verbose --export-release "Web" ./web/index.html

      - name: Add coi-serviceworker for SharedArrayBuffer
        run: |
          curl -fsSL https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js > web/coi-serviceworker.min.js
          
      - name: Patch HTML for COOP/COEP
        run: |
          sed -i 's#<head>#<head>\n\t<script src="coi-serviceworker.min.js"></script>#' web/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
